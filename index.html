<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapStyle Friend Pack 2</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#001219,#005f73);color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:22px}.app{width:min(430px,100%);text-align:center}h1{margin:4px}.sub,#status{color:#bde0e6;font-size:14px}.camera{position:relative;aspect-ratio:3/4;background:#062c33;border:3px solid #0a9396;border-radius:26px;overflow:hidden;margin-top:16px}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}.placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:30px;color:#bde0e6}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button{border:0;border-radius:13px;padding:11px 4px;background:#0a5160;color:#fff;font-weight:bold;cursor:pointer}.active{background:#94d2bd;color:#00252d}.capture{width:100%;margin-top:10px;background:#ee9b00;color:#241500;font-size:16px}#status{margin-top:9px;min-height:18px}
</style></head><body><main class="app"><h1>Friend Pack 2</h1><div class="sub">Flowers • Gamer • Angel • Fire • Ocean</div><div class="camera"><video id="video" autoplay playsinline></video><canvas id="overlay"></canvas><div id="placeholder" class="placeholder">Allow camera access to try the filters.</div></div><div class="controls"><button class="active" data-filter="flower">🌸 Flower</button><button data-filter="gamer">🎮 Gamer</button><button data-filter="angel">😇 Angel</button><button data-filter="fire">🔥 Fire</button><button data-filter="ocean">🌊 Ocean</button><button id="cameraBtn">📷 Camera</button></div><button id="capture" class="capture">📸 Take Photo</button><div id="status">Starting camera...</div></main><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d'),statusEl=document.querySelector('#status'),placeholder=document.querySelector('#placeholder');let current='flower';
async function startCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;placeholder.style.display='none';statusEl.textContent='Camera ready';}catch(e){statusEl.textContent='Camera unavailable';placeholder.textContent='Open through localhost or HTTPS, then allow camera access.';}}
function resize(){canvas.width=video.videoWidth||430;canvas.height=video.videoHeight||573}video.addEventListener('loadedmetadata',resize);window.addEventListener('resize',resize);function label(t,x,y,s,c='#fff'){ctx.font=`bold ${s}px Arial`;ctx.textAlign='center';ctx.fillStyle=c;ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(t,x,y);ctx.shadowBlur=0}
function draw(){const w=canvas.width,h=canvas.height;if(!w){requestAnimationFrame(draw);return}ctx.clearRect(0,0,w,h);
if(current==='flower'){for(let i=0;i<9;i++)label(i%2?'🌸':'🌼',25+i*(w-50)/8,65+(i%2)*15,37);label('BLOOM & SHINE',w/2,h-42,29,'#ffafcc')}
if(current==='gamer'){ctx.strokeStyle='#80ffdb';ctx.lineWidth=7;ctx.strokeRect(12,12,w-24,h-24);label('PLAYER ONE',w/2,58,33,'#80ffdb');label('🎮',w/2,h-55,62);label('LEVEL UP!',w/2,h-25,21,'#f9c74f')}
if(current==='angel'){ctx.strokeStyle='#ffe66d';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(w/2,90,75,22,0,0,7);ctx.stroke();label('✨',70,130,39);label('✨',w-70,150,39);label('ANGEL VIBES',w/2,h-43,31,'#fff3b0')}
if(current==='fire'){ctx.fillStyle='rgba(180,30,0,.18)';ctx.fillRect(0,0,w,h);label('TOO HOT',w/2,58,36,'#ffba08');for(let i=0;i<8;i++)label('🔥',28+i*(w-56)/7,h-42-(i%2)*18,44)}
if(current==='ocean'){ctx.fillStyle='rgba(0,110,180,.25)';ctx.fillRect(0,0,w,h);label('OCEAN SOUL',w/2,55,33,'#caf0f8');for(let i=0;i<12;i++){ctx.strokeStyle='#90e0ef';ctx.lineWidth=3;ctx.beginPath();ctx.arc((i*79)%w,(i*101)%h,7+i%9,0,7);ctx.stroke()}label('🌊',w/2,h-45,58)}requestAnimationFrame(draw)}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{current=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');statusEl.textContent=b.textContent.trim()+' selected'});document.querySelector('#cameraBtn').onclick=startCamera;document.querySelector('#capture').onclick=()=>{if(!video.videoWidth){statusEl.textContent='Wait for the camera first';return}const p=document.createElement('canvas');p.width=video.videoWidth;p.height=video.videoHeight;const c=p.getContext('2d');c.drawImage(video,0,0,p.width,p.height);c.drawImage(canvas,0,0,p.width,p.height);const a=document.createElement('a');a.download='friend-pack-2.png';a.href=p.toDataURL('image/png');a.click();statusEl.textContent='Photo saved!'};startCamera();draw();
</script></body></html>
